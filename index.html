<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Payroll Project_ver_0.0.1</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <h1>급여관리 시스템</h1>
            <!-- <span class="badge">귀속연월: 2026-10</span> -->
        </div>
        <div class="header-right">
            <span class="status-indicator normal">상태: 정상</span>
        </div>
    </header>

    <main class="app-main">
        <nav class="tab-nav">
            <button class="tab-btn active" data-target="tab-payroll">급여대장 관리</button>
            <button class="tab-btn" data-target="tab-excel">엑셀 업로드</button>
            <button class="tab-btn" data-target="tab-rules">세율 및 계산 규칙</button>
        </nav>

        <!-- 급여대장 탭 -->
        <section id="tab-payroll" class="tab-content active">
            <h2>급여대장 및 항목별 명세</h2>
            <div class="toolbar">
                <input type="text" id="search-input" placeholder="이름, 부서 검색...">
                <button id="btn-calculate-all" class="btn primary">전체 일괄 계산</button>
            </div>
            <div class="table-container">
                <table id="payroll-table">
                    <thead>
                        <tr>
                            <th>성명</th>
                            <th>부서</th>
                            <!-- 지급내역 묶음 -->
                            <th class="group-pay">기본급</th>
                            <th class="group-pay">식대</th>
                            <th class="group-pay">차량운전보조금</th>
                            <th class="group-pay">연장근로수당</th>
                            <th class="group-pay">상하차수당</th>
                            <th class="group-pay">인센티브</th>
                            <th class="group-pay">지급합계</th>
                            <!-- 공제내역 묶음 -->
                            <th class="group-ded">국민연금</th>
                            <th class="group-ded">건강보험</th>
                            <th class="group-ded">장기요양보험</th>
                            <th class="group-ded">고용보험</th>
                            <th class="group-ded">소득세</th>
                            <th class="group-ded">지방소득세</th>
                            <th class="group-ded">공제합계</th>
                            <th class="net-pay">실지급액</th>
                        </tr>
                    </thead>
                    <tbody id="payroll-tbody">
                        <tr><td colspan="17" style="text-align:center; color:#6b7280;">엑셀을 업로드하거나 데이터를 불러주세요.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 엑셀 업로드 탭 -->
        <section id="tab-excel" class="tab-content">
            <h2>엑셀 업로드 및 미리보기</h2>
            <div class="card">
                <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv">
                <div id="excel-sheet-selector" style="margin-top:15px; display:none;">
                    <select id="excel-sheet-select"></select>
                    <button id="btn-parse-sheet" class="btn primary">데이터 분석 및 미리보기</button>
                </div>
            </div>
            <div id="excel-preview-container" class="card" style="margin-top:20px; display:none;"></div>
        </section>

        <!-- 설정 탭 -->
        <section id="tab-rules" class="tab-content">
            <h2>계산 규칙 및 비과세 설정</h2>
            <div class="card-grid">
                <div class="card">
                    <h3>비과세 한도</h3>
                    <label>식대 월 비과세 한도: <input type="number" id="limit-meal" value="200000"></label>
                    <label>차량운전보조금 비과세 한도: <input type="number" id="limit-vehicle" value="200000"></label>
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <div class="footer-actions">
            <button id="footer-btn-calc" class="btn primary">급여 계산</button>
            <button id="footer-btn-export" class="btn">Excel 내보내기</button>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/payroll-engine.js"></script>
    <script src="js/excel-handler.js"></script>
</body>
</html>
